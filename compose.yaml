services:
  db:
    image: postgres:17-alpine
    container_name: koli-wada-dhaba-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: koli_wada_dhaba
      POSTGRES_USER: kwd_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - koli_wada_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kwd_app -d koli_wada_dhaba"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  koli_wada_postgres:
