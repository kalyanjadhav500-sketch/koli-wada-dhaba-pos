services:
  - type: web
    name: koli-wada-dhaba-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --include=dev --workspace=@koliwada/api --workspace=@koliwada/web && npm run build
    startCommand: npm run start --workspace @koliwada/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DB_POOL_MAX
        value: "5"
      - key: CORS_ORIGINS
        value: https://localhost,capacitor://localhost,koliwada://desktop
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
